name: Launcher assets

on:
  push:
    tags: ['launcher-assets-*']
    branches: [main]
    paths:
      - 'Program/Assets/**'
      - 'Program/MinecraftWindowIconAssets.jar'
      - 'data/launcher-assets-sources.json'
      - 'tools/Build-LauncherAssets.ps1'
      - 'tools/LauncherAssetSources.ps1'
      - 'tools/DesktopPacket.ps1'
      - '.github/workflows/launcher-assets.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify reproducible assets-only package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'launcher-assets-2' }
          ./tools/Build-LauncherAssets.ps1 -OutputDirectory artifacts/desktop-assets -StagingDirectory artifacts/desktop-assets-stage -Tag $tag
          $first = Get-Content -LiteralPath artifacts/desktop-assets/launcher-assets.json -Raw
          ./tools/Build-LauncherAssets.ps1 -OutputDirectory artifacts/desktop-assets -StagingDirectory artifacts/desktop-assets-stage -Tag $tag
          if ((Get-Content -LiteralPath artifacts/desktop-assets/launcher-assets.json -Raw) -cne $first) {
            throw 'Launcher assets were not reproducible.'
          }
      - name: Publish immutable asset package
        if: startsWith(github.ref, 'refs/tags/launcher-assets-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag "artifacts/desktop-assets/$tag.pak" artifacts/desktop-assets/launcher-assets.json --verify-tag --latest=false --title "Launcher assets $tag" --notes 'Verified editable UI SVGs, game window icons, background and offline pack previews.'
          if ($LASTEXITCODE -ne 0) { throw 'Launcher asset publication failed.' }
