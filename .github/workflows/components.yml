name: Verify and publish components

on:
  push:
    branches: [main]
    tags: ['components-*']
    paths-ignore: ['catalog.json', 'README.md']
  workflow_dispatch:

concurrency:
  group: components-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  components:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.2'
      - name: Build and verify deterministic artifacts
        shell: pwsh
        run: |
          ./tools/Build-Components.ps1 -OutputDirectory artifacts/component-release/assets -VerifyReproducible
          ./Program/NoticeOverlay/Test-NoticeOverlay.ps1 -JarPath artifacts/component-release/assets/launcher-notice-agent.jar
      - name: Create and verify catalog
        shell: pwsh
        run: |
          $candidateTag = if ($env:GITHUB_REF -like 'refs/tags/components-*') { $env:GITHUB_REF_NAME } else { "components-ci-$env:GITHUB_SHA" }
          ./tools/New-ComponentCatalog.ps1 -OutputDirectory artifacts/component-release/assets -Tag $candidateTag -SourceCommit $env:GITHUB_SHA
          $catalog = Get-Content artifacts/component-release/assets/catalog.json -Raw | ConvertFrom-Json
          foreach ($artifact in $catalog.artifacts) {
            $path = Join-Path artifacts/component-release/assets $artifact.fileName
            if ((Get-Item -LiteralPath $path).Length -ne $artifact.sizeBytes -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $artifact.sha256) {
              throw "Component catalog differs from built bytes: $($artifact.id)"
            }
          }
      - name: Checkout launcher compatibility contract
        shell: pwsh
        run: |
          # Native Windows DLL paths must fit even when D: has no DOS aliases.
          # This is an ordinary source clone; test staging remains inside its artifacts/agent-runs.
          $launcherRoot = 'D:\a\l'
          if (Test-Path -LiteralPath $launcherRoot) { throw 'The short launcher source path is already occupied.' }
          git clone --filter=blob:none --single-branch --branch main --no-tags https://github.com/MarkZamore/LANMinecraft.git $launcherRoot
          if ($LASTEXITCODE -ne 0) { throw 'Cannot clone launcher contract sources.' }
          git -C $launcherRoot rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify launcher contract revision.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LAUNCHER_CONTRACT_ROOT=$launcherRoot"
      - name: Checkout exact candidate test sources
        shell: pwsh
        run: |
          $candidateSources = Join-Path $env:LAUNCHER_CONTRACT_ROOT 'LocalSources/LANMinecraft-Components-Tests'
          git clone --filter=blob:none --no-checkout --single-branch --branch main --no-tags https://github.com/MarkZamore/LANMinecraft-Components.git $candidateSources
          if ($LASTEXITCODE -ne 0) { throw 'Cannot clone exact component test sources.' }
          git -C $candidateSources checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select exact component candidate revision.' }
      - name: Setup launcher .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ env.LAUNCHER_CONTRACT_ROOT }}/global.json
      - name: Verify candidate against launcher contracts
        shell: pwsh
        working-directory: ${{ env.LAUNCHER_CONTRACT_ROOT }}
        env:
          LANMINECRAFT_COMPONENT_TEST_CANDIDATE: ${{ github.workspace }}/artifacts/component-release/assets
        run: |
          ./Program.Tests/Test-Launcher.ps1 -Profile Release -WithAdapters
          ./Program.Tests/Test-Launcher.ps1 -Profile AdaptersFull -NoBuild
      - name: Preserve compact contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-contract-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ env.LAUNCHER_CONTRACT_ROOT }}/Program.Tests/TestResults/**/tests.trx
            ${{ env.LAUNCHER_CONTRACT_ROOT }}/Program.Tests/TestResults/**/summary.json
            artifacts/component-release/assets/catalog.json
      - name: Publish immutable release
        if: startsWith(github.ref, 'refs/tags/components-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'A component release with this tag already exists. Publish a new tag.' }
          $assets = @('portable-identity-adapter.jar','launcher-notice-agent.jar','launcher-native-interop-agent.jar','LegacyForgeClientInstaller.class','catalog.json') |
            ForEach-Object { Join-Path artifacts/component-release/assets $_ }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Launcher components $env:GITHUB_REF_NAME" --notes 'Verified Java components, compatibility data and Java catalog for component API 1.'
          if ($LASTEXITCODE -ne 0) { throw 'Component release publication failed.' }
      - name: Publish catalog pointer after all assets
        if: startsWith(github.ref, 'refs/tags/components-')
        shell: pwsh
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch catalog branch.' }
          git switch -C main origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select catalog branch.' }
          Copy-Item -LiteralPath artifacts/component-release/assets/catalog.json -Destination catalog.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalog.json
          git commit -m "Publish $env:GITHUB_REF_NAME catalog [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit catalog pointer.' }
          git push origin main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish catalog pointer.' }
